<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EENON License Verification - TikTok Live Roulette Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05060a;
            --card-bg: rgba(18, 20, 32, 0.75);
            --border-color: rgba(191, 149, 63, 0.35);
            --gold-primary: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #b38728;
            --gold-grad: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 60px rgba(191, 149, 63, 0.15);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: var(--gold-grad);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(191, 149, 63, 0.4);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(191, 149, 63, 0.3); }
            50% { box-shadow: 0 0 35px rgba(252, 246, 186, 0.6); }
        }

        .logo-icon {
            font-size: 30px;
            color: #0b0c10;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(10, 10, 18, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px 18px;
            font-family: inherit;
            color: #fff;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(191, 149, 63, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-grad);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #0b0c10;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(191, 149, 63, 0.5);
            filter: brightness(1.1);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-box {
            margin-top: 20px;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13.5px;
            display: none;
            line-height: 1.4;
            text-align: left;
        }

        .message-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .message-box.loading {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(191, 149, 63, 0.15);
            border: 1px solid rgba(191, 149, 63, 0.3);
            color: #fde68a;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(253, 230, 138, 0.3);
            border-radius: 50%;
            border-top-color: #fde68a;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <div class="login-container">
        <div class="card">
            <div class="logo-area">
                <div class="logo-circle">
                    <span class="logo-icon">🔑</span>
                </div>
                <h1>EENON LICENSE</h1>
                <p class="subtitle">Provide a valid key to access the application</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="license-key">License Key</label>
                    <div class="input-wrapper">
                        <input type="text" id="license-key" placeholder="EENON-XXXX-XXXX-XXXX" value="{{SAVED_KEY}}" required autocomplete="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <input type="checkbox" id="save-key" {{SAVE_KEY_CHECKED}} style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--gold-primary);">
                    <label for="save-key" style="margin-bottom: 0; cursor: pointer; text-transform: none; font-size: 13.5px; color: var(--text-color); font-weight: normal; letter-spacing: normal;">Remember key on this device</label>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">ACTIVATE LICENSE</button>
            </form>

            <div id="message" class="message-box"></div>

            <div class="footer-text">
                EENON'S MONEY MAKER WHEEL @2026
            </div>
        </div>
    </div>

    <script>
        // --- Animated Galaxy Background ---
        (function() {
            const canvas = document.getElementById('galaxy-canvas');
            const ctx = canvas.getContext('2d');
            let width, height, stars = [], nebulae = [], shootingStars = [];

            function initGalaxy() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                
                stars = [];
                const numStars = Math.floor((width * height) / 2500);
                for (let i = 0; i < numStars; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.8 + 0.3,
                        color: ['#ffffff', '#fcf6ba', '#bf953f', '#d8b4fe', '#93c5fd', '#c084fc'][Math.floor(Math.random() * 6)],
                        alpha: Math.random(),
                        speed: Math.random() * 0.02 + 0.005,
                        vx: (Math.random() - 0.5) * 0.15,
                        vy: (Math.random() - 0.5) * 0.15
                    });
                }

                nebulae = [
                    { x: width * 0.25, y: height * 0.35, r: 400, color: 'rgba(147, 51, 234, 0.18)', vx: 0.12, vy: 0.06 },
                    { x: width * 0.75, y: height * 0.65, r: 450, color: 'rgba(191, 149, 63, 0.15)', vx: -0.09, vy: 0.09 },
                    { x: width * 0.5, y: height * 0.2, r: 350, color: 'rgba(59, 130, 246, 0.15)', vx: 0.07, vy: -0.07 }
                ];
            }

            function drawGalaxy() {
                ctx.fillStyle = '#05060a';
                ctx.fillRect(0, 0, width, height);

                // Nebulae
                nebulae.forEach(n => {
                    n.x += n.vx;
                    n.y += n.vy;
                    if (n.x < -100 || n.x > width + 100) n.vx *= -1;
                    if (n.y < -100 || n.y > height + 100) n.vy *= -1;

                    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
                    grad.addColorStop(0, n.color);
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Stars
                stars.forEach(s => {
                    s.alpha += s.speed;
                    if (s.alpha > 1 || s.alpha < 0.15) s.speed *= -1;
                    s.x += s.vx;
                    s.y += s.vy;
                    if (s.x < 0) s.x = width;
                    if (s.x > width) s.x = 0;
                    if (s.y < 0) s.y = height;
                    if (s.y > height) s.y = 0;

                    ctx.save();
                    ctx.globalAlpha = Math.abs(s.alpha);
                    ctx.fillStyle = s.color;
                    ctx.shadowColor = s.color;
                    ctx.shadowBlur = s.radius * 3;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                requestAnimationFrame(drawGalaxy);
            }

            window.addEventListener('resize', initGalaxy);
            initGalaxy();
            drawGalaxy();
        })();

        // --- License Form Verification ---
        const form = document.getElementById("login-form");
        const keyInput = document.getElementById("license-key");
        const submitBtn = document.getElementById("submit-btn");
        const messageBox = document.getElementById("message");

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const startupError = `{{STARTUP_ERROR}}`;
        if (startupError && startupError !== '{{' + 'STARTUP_ERROR}}') {
            showMessage(startupError, 'error');
        }

        function showMessage(text, type) {
            messageBox.className = `message-box ${type}`;
            if (type === 'loading') {
                messageBox.innerHTML = `<span class="spinner"></span>${text}`;
            } else {
                messageBox.textContent = text;
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const key = keyInput.value.trim();
            if (!key) return;

            const saveKey = document.getElementById("save-key").checked;

            submitBtn.disabled = true;
            showMessage("Verifying key and registering hardware ID...", "loading");

            try {
                const fetchUrl = token ? `/api/verify?token=${token}` : `/api/verify`;
                const response = await fetch(fetchUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ key: key, save_key: saveKey })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (parseErr) {
                    data = { success: false, message: "Invalid key response." };
                }

                if (response.ok && data.success) {
                    localStorage.setItem("roulette_license_key", key);
                    showMessage(data.message || "Key activated! Loading application...", "success");
                    setTimeout(() => {
                        window.location.href = token ? `/?token=${token}` : `/`;
                    }, 1200);
                } else {
                    showMessage(data.message || "Invalid or rejected key. Please check your key.", "error");
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMessage("Connection error while activating. Please try again.", "error");
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
