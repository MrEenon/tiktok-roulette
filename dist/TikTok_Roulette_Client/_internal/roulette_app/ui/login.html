<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Verification - TikTok Live Roulette Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(26, 27, 38, 0.65);
            --border-color: rgba(191, 149, 63, 0.25);
            --gold-primary: #bf953f;
            --gold-light: #fcf6ba;
            --gold-dark: #b38728;
            --gold-grad: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #b38728 100%);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Backgrounds */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 1;
            opacity: 0.15;
        }

        body::before {
            background: var(--gold-primary);
            top: -100px;
            left: -100px;
        }

        body::after {
            background: #af52de;
            bottom: -100px;
            right: -100px;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        0 0 50px rgba(191, 149, 63, 0.05);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 70px;
            height: 70px;
            background: var(--gold-grad);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(191, 149, 63, 0.3);
        }

        .logo-icon {
            font-size: 30px;
            color: #0b0c10;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 18px;
            font-family: inherit;
            color: #fff;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(191, 149, 63, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: normal;
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-grad);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #0b0c10;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(191, 149, 63, 0.3);
            filter: brightness(1.1);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-box {
            margin-top: 20px;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13.5px;
            display: none;
            line-height: 1.4;
            text-align: left;
            border-left: 4px solid transparent;
        }

        .message-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border-color: var(--error-color);
        }

        .message-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: #a7f3d0;
            border-color: var(--success-color);
        }

        .message-box.loading {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border-color: var(--gold-primary);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="card">
            <div class="logo-area">
                <div class="logo-circle">
                    <span class="logo-icon">🔑</span>
                </div>
                <h1>Roulette License</h1>
                <p class="subtitle">Provide a valid key to access the application</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="license-key">License Key</label>
                    <div class="input-wrapper">
                        <input type="text" id="license-key" placeholder="XXXX-XXXX-XXXX-XXXX" value="{{SAVED_KEY}}" required autocomplete="off" spellcheck="false">
                    </div>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
                    <input type="checkbox" id="save-key" {{SAVE_KEY_CHECKED}} style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--gold-primary);">
                    <label for="save-key" style="margin-bottom: 0; cursor: pointer; text-transform: none; font-size: 13.5px; color: var(--text-color); font-weight: normal; letter-spacing: normal;">Remember key on this device</label>
                </div>

                <button type="submit" id="submit-btn" class="btn-submit">ACTIVATE LICENSE</button>
            </form>

            <div id="message" class="message-box"></div>

            <div class="footer-text">
                TIKTOK LIVE ROULETTE WHEEL &copy; 2026
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("login-form");
        const keyInput = document.getElementById("license-key");
        const submitBtn = document.getElementById("submit-btn");
        const messageBox = document.getElementById("message");

        // Helper to show messages
        function showMessage(text, type) {
            messageBox.className = `message-box ${type}`;
            if (type === 'loading') {
                messageBox.innerHTML = `<span class="spinner"></span>${text}`;
            } else {
                messageBox.textContent = text;
            }
        }

        // Get the token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Handle startup errors
        const startupError = `{{STARTUP_ERROR}}`;
        if (startupError && startupError !== '{{' + 'STARTUP_ERROR}}') {
            showMessage(startupError, 'error');
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const key = keyInput.value.trim();
            if (!key) return;

            const saveKey = document.getElementById("save-key").checked;

            submitBtn.disabled = true;
            showMessage("Verifying key and registering hardware ID...", "loading");

            try {
                const fetchUrl = token ? `/api/verify?token=${token}` : `/api/verify`;
                const response = await fetch(fetchUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ key: key, save_key: saveKey })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (parseErr) {
                    data = { success: false, message: "Invalid key response." };
                }

                if (response.ok && data.success) {
                    showMessage(data.message || "Key activated! Loading application...", "success");
                    setTimeout(() => {
                        window.location.href = token ? `/?token=${token}` : `/`;
                    }, 1200);
                } else {
                    showMessage(data.message || "Invalid or rejected key. Please check your key.", "error");
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showMessage("Connection error while activating. Please try again.", "error");
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
